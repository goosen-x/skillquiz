# skillquiz.ru — Next.js в контейнере skillquiz (127.0.0.1:3020), деплой: scripts/deploy.sh
# SSL выпущен certbot (сертификат skillquiz.ru покрывает и www).
server {
    server_name skillquiz.ru www.skillquiz.ru;

    include snippets/security-headers.conf;
    client_max_body_size 1m;

    location /.well-known/acme-challenge/ { root /var/www/skillquiz; }

    # www → без www одним 301 (в своём блоке, а не отдельным server:
    # так certbot при перевыпуске ничего не сломает)
    if ($host = www.skillquiz.ru) {
        return 301 https://skillquiz.ru$request_uri;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        include snippets/proxy-nextjs.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        include snippets/proxy-nextjs.conf;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/skillquiz.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/skillquiz.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name skillquiz.ru www.skillquiz.ru;
    location /.well-known/acme-challenge/ { root /var/www/skillquiz; }
    location / { return 301 https://skillquiz.ru$request_uri; }
}
